# rsyslog input for mqtt2logger: copy to /etc/rsyslog.d/mqtt2logger.conf and
# restart rsyslog. Leave out the module() line if imtcp is loaded already.
module(load="imtcp")
input(type="imtcp" address="127.0.0.1" port="10514" ruleset="mqtt2logger")

# one file per device, and one for the warnings and errors of all devices
template(name="mqtt2loggerDevice" type="string" string="/var/log/devices/%HOSTNAME%.log")
ruleset(name="mqtt2logger") {
    action(type="omfile" dynaFile="mqtt2loggerDevice")
    if $syslogseverity <= 4 then action(type="omfile" file="/var/log/devices/warn")
}
